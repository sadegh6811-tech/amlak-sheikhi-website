<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="48" fill="url(#greenGrad)"/>
  
  <!-- Roof -->
  <path d="M 45 105 L 100 55 L 155 105" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Building body -->
  <path d="M 60 105 L 60 155 L 140 155 L 140 105" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Door -->
  <rect x="85" y="122" width="30" height="33" rx="5" fill="url(#goldGrad)"/>
  
  <!-- Windows -->
  <rect x="68" y="118" width="12" height="12" rx="3" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="120" y="118" width="12" height="12" rx="3" fill="url(#goldGrad)" opacity="0.85"/>
</svg>
